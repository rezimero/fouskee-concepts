name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel / MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fouskee_concepts_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, mysqli
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare test environment
        shell: pwsh
        run: |
          @"
          APP_NAME="Fouskee Concepts"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          LOG_CHANNEL=stderr
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=fouskee_concepts_test
          DB_USERNAME=root
          DB_PASSWORD=root
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          "@ | Set-Content .env.testing -Encoding utf8
          php artisan key:generate --env=testing --force

      - name: Build test schema
        run: php artisan migrate:fresh --env=testing --force

      - name: Install MySQL audit protections
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password=root \
            fouskee_concepts_test \
            < database/security/audit-events-append-only.sql

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit --locked

  frontend:
    name: React / TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  source-quality:
    name: Source quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce source file limits
        shell: pwsh
        run: ./scripts/quality/check-source-lines.ps1
